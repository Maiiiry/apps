version: v2
clean: true
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: protos/gen/go
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
    out: protos/gen/go
    opt:
      - paths=source_relative
inputs:
  - directory: protos
    paths:
      - protos/delcore/v1
